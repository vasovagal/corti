[package]
name = "corti-postprocess-providers"
description = "Injected HTTP and broker adapters for Corti hosted transcript post-processing."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
corti-postprocess = { workspace = true }
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
ureq = { version = "2", default-features = true }
url = "2"
zeroize = { workspace = true }

[features]
default = []
# Codex app-server is experimental and unsupported for production workloads. Compiling this feature
# does not approve or enable it; construction also requires an explicit product-approval value.
codex-experimental = []
