[package]
name = "corti-aec"
description = "Offline acoustic echo cancellation for corti: NLMS adaptive filter to remove speaker bleed."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# Frequency-domain block adaptive filter (overlap-save FDAF) — see design/04-corti-aec.md.
rustfft = "6"
# `AecScores` and `BlockStats` derive Serialize/Deserialize so scores and the per-block echo record can be
# emitted as JSON (the aec_file `--json` flag, corti-bench, the `-aec-stats.json` sidecar).
serde.workspace = true
# One line per call: the locked mic-to-far delay (#107's cheapest diagnostic). The DSP itself stays silent.
tracing.workspace = true

[dev-dependencies]
# The `aec_file` audition example reads/writes WAVs; tests are pure DSP (std only).
hound = "3.5"
# `aec_file --json` serializes AecScores to one JSON line (example-only; not needed by the library).
serde_json.workspace = true
