[package]
name = "corti-transcribe-local"
description = "Local on-device backend for corti: Parakeet-TDT via sherpa/ONNX CPU or transcribe.cpp/GGML Metal."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
corti-core = { workspace = true }
corti-transcribe = { workspace = true }
anyhow = { workspace = true }
# Structured logging (issue #76): per-model load timing + per-job transcription timing.
tracing = { workspace = true }

# ONNX runtime + models: ASR (Parakeet-TDT transducer), Silero VAD, pyannote speaker diarization — all
# ONNX, one runtime. `static` (default) downloads a prebuilt osx-arm64 lib at first build; set
# SHERPA_ONNX_LIB_DIR for hermetic/offline builds. See design/adr/0003-local-asr-sherpa-onnx.md.
sherpa-onnx = "1.13"

# Read the 2-track WAV (ch0 = mic, ch1 = system tap) that corti-capture writes: 16-bit int raw, or 32-bit
# float once AEC-cleaned.
hound = "3.5"
# Default model cache under ~/Library/Caches/corti/models/ (guardrail #5: outside any vault).
dirs = "6"

# Async `Stream` adapter (feature `stream` only — sync core, async at the edge; ADR 0009). Pinned in the
# workspace root.
tokio = { workspace = true, features = ["sync"], optional = true }
futures-core = { workspace = true, optional = true }

# GGML ASR spike (ADR 0011): the same Parakeet-TDT GGUF via transcribe.cpp — Metal on Apple Silicon by
# default. Pin upstream `main` exactly: this includes post-v0.1.3 work and keeps native source builds
# reproducible while 0.2.0 is unreleased. Compiles the vendored C++/ggml tree at build time (needs CMake);
# only pulled in by the `ggml` feature.
transcribe-cpp = { version = "0.2.0", git = "https://github.com/handy-computer/transcribe.cpp.git", rev = "553f1099a2b3a5bc4421894be171f09960fc0f3a", optional = true }

[features]
# App-controlled schema-v1 instrumentation. Empty because diagnostics already supply `tracing`; cfg-gating
# removes every new offline span when the app integration feature is compiled out.
offline-tracing = []

# Async adapter: a `futures_core::Stream<Item = Vec<Word>>` over the sync `LiveTranscriber` (ADR 0009). OFF
# by default — no tokio/futures in the default build; the core stays runtime-free (guardrail 9).
stream = ["dep:tokio", "dep:futures-core"]

# ADR 0011 spike: the transcribe.cpp (GGML/Metal) ASR engine, selected at runtime via
# `LocalConfig::asr_engine = "ggml"`. OFF by default — the default build is byte-for-byte unchanged and
# does not compile the C++ tree.
ggml = ["dep:transcribe-cpp"]

[dev-dependencies]
# The transcribe_file example builds a RecordingMeta, which carries chrono timestamps.
chrono = { workspace = true }
