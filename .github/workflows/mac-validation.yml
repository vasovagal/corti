name: mac-validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'crates/**'
      - 'app/**'
      - 'bench/**'
      - 'scripts/quality/**'
      - 'Cargo.lock'
      - '.github/workflows/mac-validation.yml'

permissions:
  contents: read

concurrency:
  group: mac-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: macos-26
    outputs:
      commits: ${{ steps.plan.outputs.commits }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: plan
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || 'origin/main' }}
          HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/quality/commits.py plan --base "$BASE_REF" --head "$HEAD_REF" --event "$EVENT_NAME" --github-output "$GITHUB_OUTPUT"

  commits:
    needs: plan
    if: needs.plan.outputs.commits != '[]'
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        sha: ${{ fromJSON(needs.plan.outputs.commits) }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ matrix.sha }}
      - uses: ./.github/actions/rust-setup
        with:
          components: clippy rustfmt
          cache-key: ci
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/ui/package-lock.json
      - name: Frontend install + build + test
        working-directory: app/ui
        run: |
          npm ci
          npm run build
          npm test
      - name: Check and lint this commit
        run: python3 scripts/quality/commits.py check

  native:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/rust-setup
        with:
          components: clippy rustfmt
          cache-key: ci
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/ui/package-lock.json
      - name: Frontend install + build + test
        working-directory: app/ui
        run: |
          npm ci
          npm run build
          npm test
      - name: Test validation scripts
        run: python3 -m unittest discover -s scripts/quality -p 'test_*.py'
      - name: Hardware
        run: |
          system_profiler SPHardwareDataType SPDisplaysDataType | tee "$RUNNER_TEMP/quality-hardware.txt"
          cat "$RUNNER_TEMP/quality-hardware.txt" >> "$GITHUB_STEP_SUMMARY"
      - name: Read the app's pinned model catalog
        id: catalog
        run: python3 scripts/quality/native.py catalog --output "$RUNNER_TEMP/catalog.json" --github-output "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/quality-model-archives
          key: quality-models-${{ steps.catalog.outputs.model_cache_key }}
      - name: Download and verify models (including cache hits)
        run: python3 scripts/quality/native.py models --catalog "$RUNNER_TEMP/catalog.json" --cache-dir "$RUNNER_TEMP/quality-model-archives" --model-dir "$RUNNER_TEMP/quality-models"
      - name: Generate synthetic speech
        run: python3 scripts/quality/native.py fixtures --output-dir "$RUNNER_TEMP/quality-fixtures"
      - name: Probe Metal and run native ASR tests
        run: python3 scripts/quality/run_native.py --model-dir "$RUNNER_TEMP/quality-models" --fixtures "$RUNNER_TEMP/quality-fixtures/fixtures.json" --output-dir "$RUNNER_TEMP/quality-results"
      - name: Preserve native results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-native-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/quality-results
          if-no-files-found: warn
