name: ci

# LAWS §3: the PR gate. Tests run on PRs (and main pushes); tags do NOT re-run this — a tag trusts the
# green main it was cut from. macOS-only because corti links CoreAudio (corti-coreaudio's bindings don't
# build elsewhere), so unlike vagus there is no cheap ubuntu lane.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Pin macos-26 (Tahoe) — the newest GA runner image (macos-latest migrates to it 2026-06-15); pin
    # explicitly rather than ride the moving macos-latest. minimumSystemVersion 14.2 builds fine on newer SDKs.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/rust-setup
        with:
          components: clippy rustfmt
          cache-key: ci

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/ui/package-lock.json

      # Build the frontend FIRST: the app crate's generate_context!() reads tauri.conf.json's frontendDist
      # (ui/dist), so cargo won't compile the workspace until ui/dist exists. `npm run build` also runs
      # `tsc --noEmit` (the typecheck); `npm test` runs vitest (app/ui/src/lib/consent.test.ts).
      - name: Frontend install + build + test
        working-directory: app/ui
        run: |
          npm ci
          npm run build
          npm test

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy (default features = dual backend + offline-tracing)
        run: cargo clippy --all-targets -- -D warnings

      - name: clippy (all features = dual backend + offline-tracing)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: test (default features)
        run: cargo test --locked

      # Guardrail 6: each app backend must lint and test independently, in addition to the combined build.
      - name: clippy (aws only, no default features)
        run: cargo clippy --locked -p corti-app --all-targets --no-default-features --features aws -- -D warnings

      - name: test (aws only, no default features)
        run: cargo test --locked -p corti-app --no-default-features --features aws

      - name: clippy (local only, no default features)
        run: cargo clippy --locked -p corti-app --all-targets --no-default-features --features local -- -D warnings

      - name: test (local only, no default features)
        run: cargo test --locked -p corti-app --no-default-features --features local

      # ADR 0016: prove the exporter-only and completely compiled-out postures independently.
      - name: clippy (offline tracing only, no backend/default features)
        run: cargo clippy --locked -p corti-app --all-targets --no-default-features --features offline-tracing -- -D warnings

      - name: test (offline tracing only, no backend/default features)
        run: cargo test --locked -p corti-app --no-default-features --features offline-tracing

      - name: check (offline tracing compiled out)
        run: cargo check --locked -p corti-app --no-default-features

      - name: sccache stats
        if: always()
        run: sccache --show-stats

  msrv:
    name: Rust 1.96.0
    runs-on: macos-26
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/rust-setup
        with:
          toolchain: 1.96.0
          cache-key: ci-msrv

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/ui/package-lock.json

      - name: Frontend install + build
        working-directory: app/ui
        run: |
          npm ci
          npm run build

      - name: test (official default features)
        run: cargo test --locked -p corti-app

      - name: test (offline tracing only, no backend/default features)
        run: cargo test --locked -p corti-app --no-default-features --features offline-tracing

      - name: check (offline tracing compiled out)
        run: cargo check --locked -p corti-app --no-default-features

      - name: sccache stats
        if: always()
        run: sccache --show-stats
